<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166534" />
    <title>অফলাইন · Offline — বাজারচিনি</title>
    <style>
      :root {
        --bg: #faf7f0;
        --ink: #1f2937;
        --muted: #4b5563;
        --brand: #166534;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          'Hind Siliguri',
          'Noto Sans Bengali',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        color: var(--brand);
        font-size: 1.6rem;
        margin: 16px 0 4px;
      }
      p {
        color: var(--muted);
        margin: 4px 0 16px;
      }
      .en {
        font-size: 0.95rem;
      }
      button {
        background: var(--brand);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>আপনি অফলাইনে আছেন</h1>
      <p>আগে খোলা পাতাগুলো এখনো দেখা যাবে। সর্বশেষ দাম দেখতে আবার সংযুক্ত হোন।</p>
      <p class="en" lang="en">
        You're offline. Pages you've opened before are still available — reconnect to see the latest
        prices.
      </p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন · Try again</button>
    </main>
  </body>
</html>
